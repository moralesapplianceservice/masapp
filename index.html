<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Morales Appliance Service · Servicio e Inventario</title>
<meta name="theme-color" content="#1750C2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MAS Servicio">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Atkinson Hyperlegible';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Sofia Sans Condensed';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/sofia-sans-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Sofia Sans Condensed';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/sofia-sans-condensed-latin-800-normal.woff2) format('woff2')}
</style>
<style>
:root{
  /* Layout: app shell with a sticky top bar, a bottom tab bar on phones and a left rail from 960px; the perforated order stub and the dashed route line are the only ornaments */
  --bg:#ECEFEC;
  --surface:#FFFFFF;
  --ink:#15212B;
  --muted:#5B6974;
  --accent:#1750C2;
  --tag:#F2C230;
  --line:#D2D9D6;
  --soft:#E4EAF8;
  --tag-ink:#231C02;
  --tag-fg:#6B5100;
  --tag-soft:#FBF1C9;
  --accent-ink:#FFFFFF;
  --ok:#1C7C45; --ok-soft:#DCEFE3;
  --warn:#A55F00; --warn-soft:#FAEBD5;
  --crit:#B92F2F; --crit-soft:#F7DEDE;
  --shadow:0 1px 2px rgba(20,33,43,.06),0 8px 24px rgba(20,33,43,.10);
  --r:10px;
  --top:58px;
  --font-display:"Sofia Sans Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --font-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1316; --surface:#151E24; --ink:#E3EAEE; --muted:#93A2AC; --accent:#7EA6FF; --tag:#E7B828;
    --line:#26343D; --soft:#1B2943; --tag-ink:#1F1800; --tag-fg:#E7B828; --tag-soft:#342B10; --accent-ink:#0A1428;
    --ok:#5FCB8C; --ok-soft:#14301F; --warn:#F1A649; --warn-soft:#382811; --crit:#F27C7C; --crit-soft:#3A1B1B;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1316; --surface:#151E24; --ink:#E3EAEE; --muted:#93A2AC; --accent:#7EA6FF; --tag:#E7B828;
  --line:#26343D; --soft:#1B2943; --tag-ink:#1F1800; --tag-fg:#E7B828; --tag-soft:#342B10; --accent-ink:#0A1428;
  --ok:#5FCB8C; --ok-soft:#14301F; --warn:#F1A649; --warn-soft:#382811; --crit:#F27C7C; --crit-soft:#3A1B1B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:800;line-height:1.08;margin:0;text-wrap:balance}
h1{font-size:32px;letter-spacing:-.005em}
h2{font-size:19px;text-transform:uppercase;letter-spacing:.06em}
h3{font-size:23px}
h4{font-size:16px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.mono{font-family:var(--font-mono);font-size:.86em;letter-spacing:-.01em}
.tnum{font-variant-numeric:tabular-nums}
.spacer{flex:1}
.hidden{display:none!important}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* ---------- Shell ---------- */
.app{min-height:100%;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;height:var(--top);display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand-name{font-family:var(--font-display);font-weight:800;font-size:22px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:11.5px;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;margin-top:3px}
.conn{width:10px;height:10px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.conn.ok{background:var(--ok)} .conn.slow,.conn.error{background:var(--warn)} .conn.nodb{background:var(--crit)}
.who{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px 5px 5px;cursor:pointer;max-width:52vw;font-weight:700;font-size:14.5px}
.who span.lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--c,var(--ink));color:#fff;font-weight:700;font-size:12px;flex:0 0 auto;letter-spacing:.02em}
.layout{flex:1;display:flex;min-height:0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:2px;background:var(--surface);border-top:1px solid var(--line);padding:5px 6px calc(5px + env(safe-area-inset-bottom))}
.tab{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:9px;color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:700;white-space:nowrap}
.tab svg.i{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--accent);background:var(--soft)}
main#view{flex:1;min-width:0;width:100%;max-width:1240px;margin:0 auto;padding:18px 16px 104px;display:flex;flex-direction:column;gap:22px}
@media (min-width:960px){
  .tabs{position:sticky;top:var(--top);bottom:auto;align-self:flex-start;flex-direction:column;width:216px;flex:0 0 216px;height:calc(100vh - var(--top));border-top:0;border-right:1px solid var(--line);padding:14px 12px;gap:4px}
  .tab{flex:0 0 auto;flex-direction:row;gap:12px;font-size:15.5px;padding:11px 12px}
  main#view{padding:26px 30px 48px}
}

/* ---------- Building blocks ---------- */
section{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-head{display:flex;flex-direction:row;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.row-wrap{display:flex;flex-direction:row;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar{display:flex;flex-direction:row;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar .grow{flex:1 1 240px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:42px;padding:8px 15px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:15px;line-height:1.2;text-decoration:none;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-left:8px;padding-right:8px}
.btn.danger{color:var(--crit);border-color:var(--crit-soft)}
.btn.sm{min-height:36px;padding:6px 11px;font-size:14px;border-radius:8px}
.btn[disabled],.icon-btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{width:38px;height:38px;display:inline-grid;place-items:center;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;flex:0 0 auto;padding:0}
.icon-btn:hover{border-color:var(--muted)}
.x{background:transparent;border:0;width:40px;height:40px;display:grid;place-items:center;border-radius:9px;cursor:pointer;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:700;line-height:1.55;white-space:nowrap;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.st-nueva{background:var(--surface);color:var(--ink);border-color:var(--muted)}
.st-prog{background:var(--soft);color:var(--accent);border-color:transparent}
.st-camino{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.st-sitio{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.st-pieza{background:var(--tag-soft);color:var(--tag-fg);border-color:var(--tag)}
.st-ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.st-cancel{background:transparent;color:var(--crit);border-color:var(--crit-soft);text-decoration:line-through}
.flag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:5px;background:var(--crit);color:#fff;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;align-self:start}
.stub{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:62px;padding:5px 10px 5px 9px;margin-right:6px;background:var(--tag);color:var(--tag-ink);font-family:var(--font-display);font-weight:800;font-size:20px;line-height:1.1;letter-spacing:.02em;border-radius:6px 0 0 6px;font-variant-numeric:tabular-nums;flex:0 0 auto}
.stub::before{content:"#";opacity:.55;font-size:.8em;margin-right:1px}
.stub::after{content:"";position:absolute;top:0;bottom:0;right:-6px;width:6px;background:radial-gradient(circle at 100% 50%,transparent 2.6px,var(--tag) 3.1px) 0 0/6px 8px repeat-y}
.stub.sm{min-width:0;font-size:15px;padding:2px 7px 2px 6px}
.empty{padding:22px 16px;border:1.5px dashed var(--line);border-radius:var(--r);text-align:center;color:var(--muted)}
.banner{padding:11px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-weight:700;font-size:15px}
.banner.info{background:var(--soft);color:var(--accent)}
.banner.crit{background:var(--crit-soft);color:var(--crit)}
.progress{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:var(--p,0%);transition:width .2s}
.dot{width:11px;height:11px;border-radius:50%;background:var(--c,var(--accent));flex:0 0 auto;display:inline-block}

/* ---------- Forms ---------- */
.inp{width:100%;min-height:44px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--ink)}
.inp:focus{border-color:var(--accent)}
textarea.inp{min-height:86px;resize:vertical;line-height:1.4}
select.inp{padding-right:8px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:13px;font-weight:700;color:var(--muted)}
.grid2,.grid3{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:620px){.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}}
.search{position:relative}
.search svg.i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .inp{padding-left:40px}
.chk{display:inline-flex;align-items:center;gap:9px;font-size:15px;cursor:pointer;min-height:40px}
.chk input{width:21px;height:21px;accent-color:var(--accent);margin:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .c{opacity:.65;margin-left:5px;font-variant-numeric:tabular-nums}

/* ---------- Home ---------- */
.hello{display:flex;flex-direction:column;gap:12px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:760px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;gap:4px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;text-decoration:none;color:inherit;cursor:pointer;text-align:left;min-width:0}
.tile:hover{border-color:var(--muted)}
.t-label{font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.t-val{font-family:var(--font-display);font-weight:800;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.t-sub{font-size:13.5px;color:var(--muted)}
.tile.alert .t-val{color:var(--crit)}
.techgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.tcard header{display:flex;align-items:center;gap:8px}
.tcard header b{font-size:17px}
.segs{display:flex;gap:3px;min-height:9px}
.seg{flex:1;height:9px;border-radius:3px;background:var(--line)}
.seg.done{background:var(--ok)} .seg.now{background:var(--accent)} .seg.pieza{background:var(--tag)}
.att{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.att-row{display:flex;gap:10px;align-items:center;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;width:100%;color:var(--ink)}
.att-row:last-child{border-bottom:0}
.att-row:hover{background:var(--bg)}
.att-ic{width:8px;align-self:stretch;border-radius:4px;background:var(--warn);flex:0 0 auto}
.att-ic.crit{background:var(--crit)} .att-ic.tag{background:var(--tag)}
.onb ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:6px}

/* ---------- Orders ---------- */
.list{display:flex;flex-direction:column;gap:8px}
.ocard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:start;width:100%;text-align:left;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;color:var(--ink)}
.ocard:hover{border-color:var(--muted)}
.oc-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.oc-title{font-weight:700;font-size:16.5px}
.oc-sub{font-size:14.5px;overflow-wrap:anywhere}
.oc-meta{display:flex;flex-wrap:wrap;gap:5px 10px;align-items:center;margin-top:5px;font-size:13.5px;color:var(--muted)}
.lookup{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:9px;padding:10px 12px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.kv{display:grid;gap:10px}
.kv>div>span{display:block;font-size:12.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.contact{gap:8px}
.ct-phone{font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:14px}
.hist li{display:grid;grid-template-columns:118px 1fr;gap:10px}
details.more{border:1px solid var(--line);border-radius:10px;padding:0 12px}
details.more>summary{cursor:pointer;font-weight:700;padding:12px 0;color:var(--accent)}
details.more[open]{padding-bottom:12px}
details.more[open]>summary{margin-bottom:6px}
details.more>.grid2,details.more>.grid3{margin-bottom:12px}
.sig{border:1.5px dashed var(--muted);border-radius:10px;background:#fff;touch-action:none;width:100%;height:150px;display:block;cursor:crosshair}
.sig-img{max-width:320px;width:100%;background:#fff;border-radius:8px;border:1px solid var(--line)}

/* ---------- Routes ---------- */
.datebar{display:flex;align-items:center;gap:8px}
.datebar .d{flex:1;min-width:0;text-align:center;font-family:var(--font-display);font-weight:800;font-size:22px;line-height:1.05}
.datebar .d small{display:block;font-family:var(--font-body);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;align-items:start}
.col{background:color-mix(in srgb,var(--surface) 50%,var(--bg));border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:12px;min-width:0}
.col-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.col-head b{font-size:17px}
.route{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.stop{position:relative;display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px}
.stop::before{content:"";position:absolute;left:21px;top:46px;bottom:-14px;width:2px;background:repeating-linear-gradient(to bottom,var(--muted) 0 5px,transparent 5px 10px);opacity:.55}
.stop:last-child::before{display:none}
.stop-no{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2.5px solid var(--ink);font-family:var(--font-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.stop.is-done .stop-no{background:var(--ok);border-color:var(--ok);color:#fff}
.stop.is-now .stop-no{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 5px var(--soft)}
.stop.is-pieza .stop-no{background:var(--tag);border-color:var(--tag);color:var(--tag-ink)}
.stop-body{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stop.is-done .stop-body{opacity:.75}
.stop-head{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.stop-head b{font-size:17px}
.stop-addr{font-size:15px;overflow-wrap:anywhere}
.stop-what{font-size:14.5px;display:flex;align-items:center;flex-wrap:wrap;gap:4px;overflow-wrap:anywhere}
.stop-actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:2px}
.pool-card{display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.pool-card .ph{display:flex;align-items:flex-start;gap:8px}
.pool-card .ph .grow{flex:1;min-width:0}
.near{color:var(--ok);font-weight:700}

/* ---------- Inventory ---------- */
.vals{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.vals::-webkit-scrollbar{display:none}
.val{flex:0 0 auto;padding:8px 12px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-size:13.5px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;width:100%}
.filters .chk{min-height:44px}
.val b{display:block;font-family:var(--font-display);font-size:21px;font-weight:800;font-variant-numeric:tabular-nums}
.irow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:11px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-align:left;width:100%;cursor:pointer;color:var(--ink)}
.irow:hover{border-color:var(--muted)}
.i-name{font-weight:700;overflow-wrap:anywhere}
.i-meta{font-size:13.5px;color:var(--muted);overflow-wrap:anywhere}
.i-price{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.stocks{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.sq{display:inline-flex;gap:6px;align-items:baseline;padding:2px 8px;border-radius:6px;background:var(--bg);font-size:13px;color:var(--muted)}
.sq b{font-variant-numeric:tabular-nums;font-size:14.5px;color:var(--ink)}
.sq.low{background:var(--warn-soft);color:var(--warn)} .sq.low b{color:var(--warn)}
.sq.zero{opacity:.6}
.sq.neg{background:var(--crit-soft);color:var(--crit)} .sq.neg b{color:var(--crit)}

async function mutateStock(itemId, fn, mid, extra) {
  const ref = itemRef(itemId);
  return withLease(ref, async () => {
    const snap = await call(() => ref.get());
    if (!snap.exists) throw E('missing', 'Ese artículo ya no existe en el inventario.');
    const d = snap.data() || {};
    const lm = Array.isArray(d.lm) ? d.lm : [];
    if (mid && lm.includes(mid)) return { diff: {}, already: true };
    const cur = d.stock || {};
    const next = fn(cur);
    const patch = { stock: next, upd: nowIso(), ...(extra || {}) };
    if (mid) patch.lm = [...lm, mid].slice(-20);
    await call(() => ref.update(patch));

}

let cntDirty = {}, cntDirtyLoc = '', cntTimer = 0;
INP.cnt = el => {
  const id = el.dataset.id; const v = el.value.trim();
  if (cntDirtyLoc && cntDirtyLoc !== S.ui.countLoc) flushCount();
  cntDirtyLoc = S.ui.countLoc;
  S.ui.cntLocal[id] = v;
  cntDirty[id] = v === '' ? null : r2(num(v));

  if (it && cell) { const d = v === '' ? null : r2(num(v) - qtyAt(it, S.ui.countLoc)); cell.innerHTML = d == null ? '<span class="muted">—</span>' : `<span class="${d > 0 ? 'pos' : d < 0 ? 'neg' : ''}">${d > 0 ? '+' : ''}${fq(d)}</span>`; }
  clearTimeout(cntTimer); cntTimer = setTimeout(flushCount, 900);
};
async function flushCount() {
  clearTimeout(cntTimer);
  const loc = cntDirtyLoc; const e = cntDirty; cntDirty = {};
  if (!loc || !Object.keys(e).length || !S.db || S.ro) return;
  const ref = S.db.doc('counts/' + loc);
  const patch = { e, upd: nowIso(), by: S.profile };
  try {
    try { await call(() => ref.update(patch)); }
    catch (err) {
      if (err?.code !== 'invalid_argument') throw err;
      await withLease(ref, async () => { const s = await call(() => ref.get()); if (s.exists) await call(() => ref.update(patch)); else await call(() => ref.set({ loc, started: nowIso(), ...patch })); });
    }
  } catch (err) {
    console.warn(err);
    if (cntDirtyLoc === loc) { cntDirty = { ...e, ...cntDirty }; cntTimer = setTimeout(flushCount, 5000); }
    toast('No se pudo guardar el conteo todavía. Se intentará otra vez.', 'warn');
  }
}
ACT.countApply = async () => {
  await flushCount();

  const diffs = Object.entries(entries).map(([id, v]) => { const it = S.items.get(id); return it ? { it, real: r2(v), d: r2(v - qtyAt(it, loc)) } : null; }).filter(x => x && x.d !== 0);
  if (!diffs.length) { toast('No hay diferencias que aplicar.', 'warn'); return; }
  const plus = sum(diffs.filter(x => x.d > 0), x => x.d), minus = sum(diffs.filter(x => x.d < 0), x => x.d), val = sum(diffs, x => x.d * num(x.it.cost));
  const yes = await confirmDlg('Aplicar conteo', `<p>${esc(locName(loc))}: cambian <b>${diffs.length}</b> artículos.</p><p>Sobrantes <b class="pos">+${fq(plus)}</b> · Faltantes <b class="neg">${fq(minus)}</b> · Valor <b>${money(val)}</b></p><p class="small muted">Las existencias quedarán igual a lo contado y la diferencia se anota como ajuste.</p>`, 'Aplicar');
  if (!yes || !guard()) return;
  const moves = []; let fail = null;
  for (let i = 0; i < diffs.length; i++) {
    const { it, real } = diffs[i];
    if (i % 3 === 0) busy(`Aplicando ${i + 1} de ${diffs.length}…`, i / diffs.length);
    try { const cur = qtyAt(S.items.get(it.id) || it, loc); await call(() => itemRef(it.id).update({ stock: { [loc]: real }, upd: nowIso() })); const d = r2(real - cur); if (d) moves.push(mkMove('ajuste', it, d, { to: loc, note: 'Conteo físico' })); }

  busy(null);
  if (fail) toast(`Se aplicaron ${moves.length} de ${diffs.length}. ${errMsg(fail)}`, 'err'); else toast(`Conteo aplicado: ${moves.length} ajustes`, 'ok');
  schedule();
};

async function loadRestock(van) {
  S.ui.restockLoading = true;
  const since = cfg().lastRestock?.[van] || null;
  const fromDay = since ? ymd(new Date(since)) : addDays(ymd(), -6);
  const used = {};
  try {
    const qs = await call(() => S.db.collection('moves').where('day', '>=', fromDay).get());
    qs.docs.forEach(d => Object.values(d.data().e || {}).forEach(m => {
      if (!m || (since && String(m.at) < since)) return;
      if (m.k === 'uso' && m.from === van) used[m.item] = (used[m.item] || 0) + num(m.qty);
      if (m.k === 'devol' && m.to === van) used[m.item] = (used[m.item] || 0) - num(m.qty);
    }));
    S.ui.restock = { van, since, used, qty: {} };
  } catch (e) { console.warn(e); toast(errMsg(e), 'err'); S.ui.restock = { van, since, used: {}, qty: {} }; }
  S.ui.restockLoading = false; schedule();
}

async function clearDemoData(progress) {
  {
    const its = itemsArr().filter(i => i.demo).map(i => i.id);
    const ords = (await call(() => S.db.collection('orders').where('demo', '==', true).limit(1000).get())).docs.map(d => d.id);
    const mvs = (await call(() => S.db.collection('moves').where('demo', '==', true).get())).docs.map(d => d.id);
    const sls = (await call(() => S.db.collection('sales').where('demo', '==', true).get())).docs.map(d => d.id);
    const sts = (await call(() => S.db.collection('stats').where('demo', '==', true).get())).docs.map(d => d.id);
    const cus = (await call(() => S.db.collection('customers').where('demo', '==', true).limit(1000).get())).docs.map(d => d.id);
    const total = its.length + ords.length + mvs.length + sls.length + sts.length + cus.length || 1; let n = 0;
    for (const id of sts) { await call(() => S.db.doc('stats/' + id).delete()); progress(++n / total); }
    for (const id of cus) { await call(() => S.db.doc('customers/' + id).delete()); progress(++n / total); }
    for (const id of sls) {
      const ref = S.db.doc('sales/' + id);
      await withLease(ref, async () => { const s = await call(() => ref.get()); if (!s.exists) return; const keep = Object.fromEntries(Object.entries(s.data().e || {}).filter(([, x]) => x && !x.demo)); if (Object.keys(keep).length) await call(() => ref.set({ day: s.data().day, e: keep })); else await call(() => ref.delete()); });
      progress(++n / total);
    }
    for (const id of its) { await call(() => itemRef(id).delete()); progress(++n / total); }
    for (const id of ords) { await call(() => orderRef(id).delete()); progress(++n / total); }
    for (const id of mvs) {
      const ref = S.db.doc('moves/' + id);
      await withLease(ref, async () => {
        const s = await call(() => ref.get()); if (!s.exists) return;
        const keep = Object.fromEntries(Object.entries(s.data().e || {}).filter(([, m]) => m && !m.demo));
        if (Object.keys(keep).length) await call(() => ref.set({ day: s.data().day, e: keep })); else await call(() => ref.delete());
      });
      progress(++n / total);
    }
    // Los números vuelven a empezar solo si no queda nada real con número.
    const leftO = await call(() => S.db.collection('orders').limit(1).get());
    const leftS = await call(() => S.db.collection('sales').limit(1).get());
    const patch = {}; if (leftO.empty) patch.order = 1000; if (leftS.empty) patch.sale = 1000;
    if (Object.keys(patch).length) { const ref = S.db.doc('meta/counter'); const c = await call(() => ref.get()); await call(() => c.exists ? ref.update(patch) : ref.set(patch)); }
  }
}

/* ---------- Estimado de reparación: sale en la factura, no se cobra ni descuenta inventario ---------- */
const estClean = est => ({ lines: (est?.lines || []).filter(l => String(l.name || '').trim() || String(l.sku || '').trim() || num(l.price)).map(l => ({ id: l.id || uid(8), item: l.item || null, qty: num(l.qty) || 1, sku: String(l.sku || '').trim(), name: String(l.name || '').trim(), price: r2(num(l.price)) })), labor: r2(num(est?.labor)) });

function draftText(M) {
  const C = M.checks.filter(c => c.type || c.issues.length || c.result);
  const partsL = ((getOrder(M.id) || M.o).parts || []).map(p => `${fq(p.qty)} ${lc(p.name)}`);
  const eqName = c => `${art(c.type)} ${lc(c.type || 'equipo')}${c.brand ? ' ' + c.brand : ''}`;
  const dot = s => s.trim().replace(/([^.!?])$/, '$1.');
  const diag = C.map(c => {

    if (iss.length) return `Se verificó ${eqName(c)}${c.model ? ` (modelo ${c.model})` : ''} y se encontró falla en ${joinY(iss)}.`;

  }).concat(C.filter(c => c.note.trim()).map(c => dot(c.note))).join(' ');
  const de = s => s.startsWith('el ') ? 'del ' + s.slice(3) : 'de ' + s;

  const et = M.est && hasEst(M.est) ? estTotals(M.est, estIvuOn(M)) : null; let etUsed = false;
  const useEt = () => { if (!et || etUsed) return null; etUsed = true; return et; };
  const work = C.map(c => {

    switch (c.result) {

// Lo devuelto se calcula con el precio que pagó (con su descuento) y su IVU.
function retCalc(R) {
  const sale = R.sale; const g = saleGross(sale); const factor = g ? num(sale.sub) / g : 1;
  const lines = (sale.lines || []).map((l, i) => ({ l, i, q: Math.min(retLeft(sale, i), r2(num(R.q[i]))) })).filter(x => x.q > 0);
  const sub = r2(sum(lines, x => x.q * num(x.l.price) * factor)); const ip = sale.ivuOn ? ivuParts(sub) : { st: 0, mu: 0, total: 0 };
  return { lines, factor, sub, ivu: ip.total, ivuSt: ip.st, ivuMu: ip.mu, total: r2(sub + ip.total) };
}
const retTotalsHtml = () => { const t = retCalc(S.ret); return `<div class="totals" style="margin-left:auto"><span>Subtotal</span><span>${money(t.sub)}</span>${ivuRowsHtml(t.sub, t.ivu, t)}<span class="grand">A devolver</span><span class="grand">${money(t.total)}</span></div>`; };

ACT.retGo = async () => {
  const R = S.ret; if (!R || !guard()) return; const sale = R.sale;
  for (const [i, v] of Object.entries(R.q)) if (r2(num(v)) > retLeft(sale, i)) { toast(`Solo quedan ${fq(retLeft(sale, i))} de ${sale.lines[i].name} por devolver.`, 'warn'); return; }
  const t = retCalc(R);
  if (!t.lines.length) { toast('Escribe cuánto devuelve de cada artículo.', 'warn'); return; }
  if (!(await confirmDlg('Registrar devolución', `<p>Se le devuelve <b>${money(t.total)}</b> en ${esc(R.method)}.</p><p class="small muted">Lo que no está defectuoso vuelve al inventario.</p>`, 'Registrar'))) return;
  busy('Registrando la devolución…');
  let no; try { no = await nextNo('ret', 1000); } catch (e) { busy(null); toast(errMsg(e), 'err'); return; }
  const rid = uid(12), at = nowIso(), ref = 'D-' + no, from = sale.from || 'alm'; const moves = []; const done = []; let fail = null;
  for (const x of t.lines) {
    const it = S.items.get(x.l.item); const back = !!it && isStocked(it) && !R.bad[x.i]; const mid = uid(12);
    try {
      if (back) await applyStock(it.id, { [from]: x.q }, mid);
      if (it) moves.push(mkMove('devol', it, x.q, { id: mid, to: back ? from : null, ref, price: r2(num(x.l.price) * t.factor), note: `Devolución de ${sale.ref}${back ? '' : ' · defectuosa'}` }));
      done.push({ ...x, back });
    } catch (e) { fail = { x, e }; break; }
  }
  const rec = { id: rid, kind: 'dev', no, ref, at, by: S.profile, of: sale.id, ofRef: sale.ref, cust: { ...(sale.cust || {}) }, ph: sale.ph || '', from, ivuOn: !!sale.ivuOn, pay: { method: R.method }, reason: R.reason, note: (R.note || '').trim(),
    lines: done.map(x => ({ item: x.l.item, sku: x.l.sku || '', name: x.l.name, type: x.l.type || '', qty: x.q, price: r2(num(x.l.price) * t.factor), serial: x.l.serial || '', back: x.back })) };
  const sub = r2(sum(rec.lines, l => l.qty * l.price)); const ip = rec.ivuOn ? ivuParts(sub) : { st: 0, mu: 0, total: 0 };
  Object.assign(rec, { gross: -sub, disc: 0, sub: -sub, ivu: -ip.total, ivuSt: -ip.st, ivuMu: -ip.mu, total: -r2(sub + ip.total) });
  if (done.length) {
    try {
      await logMoves(moves);
      await saveSale(rec);
      const ret = { ...(sale.ret || {}) }; done.forEach(x => { ret[x.i] = r2(num(ret[x.i]) + x.q); });
      await appendMap('sales/' + ymd(new Date(sale.at)), 'e', { [sale.id]: { ret, rets: { [rid]: ref } } }, { day: ymd(new Date(sale.at)) });
      Object.assign(sale, { ret, rets: { ...(sale.rets || {}), [rid]: ref } });
      if (rec.ph.length >= 7) await upsertCustomer(rec.cust, { id: rid, k: 'devolucion', no: ref, at, what: trunc(rec.lines.map(l => l.name).join(', '), 90), total: rec.total });
    } catch (e) { console.warn(e); toast('El inventario se ajustó, pero la devolución no se guardó completa: ' + errMsg(e), 'err'); }
  }
  busy(null);
  if (fail) toast(`Se devolvieron ${done.length} de ${t.lines.length}. Falló "${fail.x.l.name}": ${errMsg(fail.e)}`, 'err');
  if (!done.length) return;
  popModal(null); popModal(null);
  toast(`Devolución ${ref} registrada`, 'ok');
  openSaleDetail(rec, null, true);
};

const remList = () => Object.entries(S.reminders?.e || {}).map(([id, r]) => ({ id, ...(r || {}) })).filter(r => r.title && r.active !== false);
function nextDue(r) {
  const clampD = (y, m, d) => new Date(y, m, Math.min(Math.max(1, d), new Date(y, m + 1, 0).getDate()));
  if (r.freq === 'una') return r.last ? null : (r.date ? parseYmd(r.date) : null);
  const ref = r.last ? parseYmd(addDays(r.last, 1)) : parseYmd(r.since || ymd());
  const day = num(r.day) || 1; const y = ref.getFullYear();
  if (r.freq === 'anual') { const m = num(r.month); const d = clampD(y, m, day); return d >= ref ? d : clampD(y + 1, m, day); }
  const step = r.freq === 'trimestral' ? 3 : 1;
  let m = r.freq === 'trimestral' ? num(r.month) % 3 : ref.getMonth();
  for (let k = 0; k < 60; k++, m += step) { const d = clampD(y, m, day); if (d >= ref) return d; }
  return null;
}
function remStatus(r) { const d = nextDue(r); if (!d) return { d: null, days: Infinity }; const days = Math.round((d - parseYmd(ymd())) / 864e5); return { d, days }; }
const dueLabel = x => x.days < 0 ? `venció hace ${-x.days} ${x.days === -1 ? 'día' : 'días'}` : x.days === 0 ? 'vence hoy' : x.days === 1 ? 'vence mañana' : `en ${x.days} días (${fmtShort(ymd(x.d))})`;
const dueReminders = () => remList().map(r => ({ r, ...remStatus(r) })).filter(x => x.d && x.days <= 7).sort((a, b) => a.days - b.days);
const remWhen = r => r.freq === 'mensual' ? `día ${num(r.day) || 1} de cada mes` : r.freq === 'anual' ? `${num(r.day) || 1} de ${MES[num(r.month)]} de cada año` : r.freq === 'trimestral' ? `día ${num(r.day) || 1}, cada 3 meses desde ${MES[num(r.month) % 3]}` : r.date ? fmtShort(r.date) : '';
function vRecordatorios() {

    <div class="rem-due">${x.d ? `<span class="pill ${x.days < 0 ? 'late' : x.days <= 7 ? 'st-pieza' : ''}">${esc(dueLabel(x))}</span>` : '<span class="pill">Hecho</span>'}</div>
    <div class="stocks">${x.d ? `<button class="btn sm ${x.days <= 7 ? 'primary' : ''}" type="button" data-act="remDone" data-id="${esc(x.r.id)}">${IC.check} Hecho</button>` : ''}<button class="btn ghost sm" type="button" data-act="remEdit" data-id="${esc(x.r.id)}">Editar</button></div></div>`).join('') || emptyMsg('No hay recordatorios.')}</section>`;

async function loadStats() {
  const months = S.ui.statsMonths; S.ui.statsLoading = true;
  try {
    const now = new Date(); const d0 = new Date(now.getFullYear(), now.getMonth() - (months - 1), 1);
    const qs = await call(() => S.db.collection('stats').where('m', '>=', `${d0.getFullYear()}-${pad(d0.getMonth() + 1)}`).get());
    const agg = {};
    qs.docs.forEach(x => Object.values(x.data().e || {}).forEach(v => { if (!Array.isArray(v)) return; const a = agg[v[0]] ||= { q: 0, rev: 0, cost: 0 }; a.q += num(v[1]); a.rev += num(v[2]); a.cost += num(v[3]); }));
    S.ui.stats = { months, agg };
  } catch (e) { console.warn(e); toast(errMsg(e), 'err'); S.ui.stats = { months, agg: {} }; }
  S.ui.statsLoading = false; schedule();
}
ACT.statsMonths = el => { S.ui.statsMonths = num(el.dataset.n) || 6; S.ui.stats = null; schedule(); };
function analysisRows() {
  const st = S.ui.stats; const days = S.ui.statsMonths * 30.4;
  return itemsArr().filter(it => it.active !== false && isStocked(it)).map(it => {
    const a = st.agg[it.id] || { q: 0, rev: 0, cost: 0 }; const stock = r2(qtyTotal(it)); const daily = a.q / days;
    const need30 = Math.ceil(daily * 30); const target = Math.max(num(it.min), need30); const sug = Math.max(0, Math.ceil(target - stock));
    return { it, q: r2(a.q), rev: r2(a.rev), profit: r2(a.rev - a.cost), stock, value: r2(Math.max(0, stock) * num(it.cost)), cover: daily > 0 ? Math.floor(stock / daily) : null, perMonth: r2(daily * 30.4), sug };
  });
}

/* ======================================================================
   Datos de Miguel: inventario (piezas y equipos) y registro de servicios.
   Los archivos viajan cifrados junto a la app; la clave está en la base de
   datos (meta/importKey), así que solo quien puede ver los datos los abre.
   ====================================================================== */
const CRYPTOJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js';
const IMP = { key: null, st: null };
let cryptoP = null;
const b64u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
function loadCryptoJS() {
  if (window.CryptoJS) return Promise.resolve(window.CryptoJS);
  if (!cryptoP) cryptoP = new Promise((res, rej) => { const s = document.createElement('script'); s.src = CRYPTOJS_URL; s.onload = () => window.CryptoJS ? res(window.CryptoJS) : rej(new Error('No se pudo abrir los datos.')); s.onerror = () => { cryptoP = null; rej(new Error('No se pudo abrir los datos. Revisa el internet.')); }; document.head.appendChild(s); });
  return cryptoP;
}
async function decryptJson(j, k64) {
  if (window.crypto?.subtle && !window.__noSubtle) {
    try {
      const key = await crypto.subtle.importKey('raw', b64u8(k64), { name: 'AES-CBC' }, false, ['decrypt']);
      const pt = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: b64u8(j.iv) }, key, b64u8(j.ct));
      return JSON.parse(new TextDecoder().decode(pt));
    } catch (e) { console.warn('descifrar', e); }
  }
  const C = await loadCryptoJS();
  const pt = C.AES.decrypt({ ciphertext: C.enc.Base64.parse(j.ct) }, C.enc.Base64.parse(k64), { iv: C.enc.Base64.parse(j.iv), mode: C.mode.CBC, padding: C.pad.Pkcs7 });
  return JSON.parse(pt.toString(C.enc.Utf8));
}
async function fetchJson(path) {
  const r = await fetch(path, { cache: 'no-store' });
  if (!r.ok) throw new Error('No se encontraron los datos para cargar (' + r.status + ').');
  return r.json();
}
async function pool(list, n, fn) {
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, list.length) }, async () => { while (i < list.length) { const k = i++; await fn(list[k], k); } }));
}
async function impMark(patch) {
  const ref = S.db.doc('meta/import');
  const s = await call(() => ref.get());
  await call(() => s.exists ? ref.update(patch) : ref.set(patch));
}
const impPending = () => !!(IMP.key?.k && !IMP.st?.finishedAt);
const fmtN = n => num(n).toLocaleString('en-US');
function impSummary() {
  const k = IMP.key || {};
  return `${fmtN(k.items)} artículos del inventario (${fmtN(k.parts)} piezas y ${fmtN(k.products)} equipos) y ${fmtN(k.services)} servicios del registro de ${esc(k.from || '2018')} a ${esc(k.to || '2026')}`;
}
function impBanner() {
  if (!impPending() || !isOffice() || S.ui.impLater || S.impRunning) return '';
  const st = IMP.st || {}; const half = num(st.inv?.done) > 0;
  return `<section class="card imp"><div class="grow"><h3>${half ? 'La carga del inventario quedó a medias' : 'El inventario y el registro de Miguel están listos para cargar'}</h3>
    <p class="small">${half ? `Van ${fmtN(st.inv.done)} de ${fmtN(st.inv.total)} artículos. Toca Seguir y continúa donde quedó.` : impSummary() + '.'}</p></div>
    <div class="row-wrap"><button class="btn primary" type="button" data-act="impOpen">${half ? 'Seguir' : 'Cargar ahora'}</button>${half ? '' : '<button class="btn ghost sm" type="button" data-act="impLater">Más tarde</button>'}</div></section>`;
}
ACT.impLater = () => { S.ui.impLater = true; schedule(); };
function impCard() {
  if (!IMP.key?.k && !IMP.st) return '';
  const st = IMP.st || {};
  if (st.finishedAt) return `<section class="card"><h3>Datos de Miguel</h3><p class="small">Cargados el ${esc(fmtDateY(ymd(new Date(st.finishedAt))))}: ${fmtN(st.counts?.items)} artículos y el registro de servicios (${fmtN(IMP.key?.services || st.counts?.services)} servicios). El historial sale al buscar un teléfono en llamadas, ventas y clientes.</p></section>`;
  return `<section class="card imp"><h3>Datos de Miguel</h3><p class="small">${impSummary()}.</p>${num(st.inv?.done) ? `<p class="small">Cargados ${fmtN(st.inv.done)} de ${fmtN(st.inv.total)} artículos.</p>` : ''}<div><button class="btn primary" type="button" data-act="impOpen">${num(st.inv?.done) ? 'Seguir con la carga' : 'Cargar ahora'}</button></div></section>`;
}
ACT.impOpen = () => {
  if (!guard() || !IMP.key?.k) return;
  if (S.impRunning) { toast('La carga ya está en curso.', 'warn'); return; }
  const demo = hasDemo();
  pushModal(`<header class="sh-head"><h3>Cargar el inventario y el registro</h3>${closeBtn}</header>
  <div class="sh-body">
    <p>Se cargan ${impSummary()}.</p>
    <ul class="small">
      <li>Cada pieza entra con su número, cambios, cantidad, costo, precio, suplidor y localización (rack y tablilla). Los equipos entran con sus números de serie.</li>
      <li>El registro de servicios sirve para ver el historial de un cliente al escribir su teléfono o buscar su nombre.</li>
      <li>Tarda unos minutos. Deja la app abierta y la pantalla encendida; si se interrumpe, sigue donde quedó.</li>
    </ul>
    ${demo ? `<label class="check"><input type="checkbox" id="imp-demo" checked> Quitar los datos de ejemplo al terminar</label>` : ''}
  </div>
  <footer class="sh-foot"><button class="btn" type="button" data-act="closeModal">Cancelar</button><button class="btn primary" type="button" data-act="impGo">Cargar</button></footer>`);
};
ACT.impGo = async () => {
  const clearAfter = !!$('#imp-demo')?.checked;
  popModal(null);
  await runImport(clearAfter);
};
async function runImport(clearAfter) {
  if (!guard()) return;
  const K = IMP.key; if (!K?.k) return;
  S.impRunning = true;
  const t0 = Date.now();
  try {
    busy('Bajando los datos…', 0.01);
    const [encInv, encHist] = await Promise.all([fetchJson(K.files?.inv || 'import/inventario.json'), fetchJson(K.files?.hist || 'import/historial.json')]);
    busy('Abriendo los datos…', 0.02);
    const items = await decryptJson(encInv, K.k);
    const arch = await decryptJson(encHist, K.k);
    const st = IMP.st || {};
    if (!st.hist?.done) {
      const ids = Object.keys(arch); let n = 0;
      await pool(ids, 4, async id => { await call(() => S.db.doc('archivo/' + id).set(arch[id])); n++; if (n % 5 === 0 || n === ids.length) busy(`Registro de servicios: ${n} de ${ids.length} grupos`, 0.02 + 0.06 * n / ids.length); });
      await impMark({ hist: { done: true, at: nowIso(), docs: ids.length } });
    }
    ARCH.docs.clear(); ARCH.all = null;
    const N = items.length; let done = Math.min(num(st.inv?.done), N);
    const now = nowIso();
    while (done < N) {
      const chunk = items.slice(done, done + 30);
      await pool(chunk, 5, async it => { const { id, ...doc } = it; await call(() => itemRef(id).set({ ...doc, active: true, lm: [], upd: now, src: 'mas' })); });
      done += chunk.length;
      busy(`Inventario: ${fmtN(done)} de ${fmtN(N)} artículos`, 0.08 + 0.88 * done / N);
      if (done % 300 < 30 || done === N) await impMark({ inv: { done, total: N } });
    }
    if (clearAfter && hasDemo()) { busy('Quitando los datos de ejemplo…', 0.97); await clearDemoData(() => {}); }
    await impMark({ finishedAt: nowIso(), by: S.me || '', secs: Math.round((Date.now() - t0) / 1000), counts: { items: N, archive: Object.keys(arch).length, services: K.services || 0 } });
    busy(null);
    toast(`Listo: ${fmtN(N)} artículos y el registro de servicios cargados.`, 'ok');
    S.ui.invTab = 'articulos'; S.ui.invQ = '';
  } catch (e) {
    busy(null); console.warn('importar', e);
    toast(`La carga se detuvo: ${errMsg(e)} Toca Seguir para continuar donde quedó.`, 'err');
  } finally { S.impRunning = false; schedule(); }
}

/* ---------- Registro de servicios anteriores ----------
   archivo/p{últimos 2 dígitos}: { e: { "787XXXXXXX": [[fecha, factura, monto | 'N/C', técnico, nombre, aproximada?], ...] } }
   archivo/sintel: los servicios que se anotaron sin teléfono. */
const ARCH = { docs: new Map(), all: null, loading: null };
// En la versión web cada servicio se guarda como texto separado por tabuladores (Firestore no acepta listas dentro de listas).
const archSplit = s => { const p = String(s).split('\t'); const n = p[1] ?? '', a = p[2] ?? ''; return [p[0] || '', /^\d+$/.test(n) ? +n : n, a === '' ? null : a === 'N/C' ? 'N/C' : +a, p[3] || '', p[4] || '', p[5] === '1']; };
const archRec = r => { const e = typeof r === 'string' ? archSplit(r) : (r || []); return { date: e[0] || '', inv: e[1] ?? '', amt: e[2], tech: e[3] || '', name: e[4] || '', approx: !!e[5] }; };
const archAmt = a => a === 'N/C' ? 'N/C' : (a == null || a === '' ? '' : money(a));
const archLine = r => `${r.date ? fmtDateY(r.date) + (r.approx ? ' (aprox.)' : '') : 'Sin fecha'} · factura ${esc(r.inv)}${archAmt(r.amt) ? ' · ' + archAmt(r.amt) : ''}${r.tech ? ' · ' + esc(r.tech) : ''}`;
async function archFor(phone) {
  const d = ph10(digits(phone));
  if (d.length !== 10 || !S.db) return [];
  const k = 'p' + d.slice(-2);
  if (!ARCH.docs.has(k)) {
    try { const s = await call(() => S.db.doc('archivo/' + k).get()); ARCH.docs.set(k, s.exists ? (s.data().e || {}) : {}); }
    catch (e) { console.warn('registro', e); return []; }
  }
  return (ARCH.docs.get(k)[d] || []).map(archRec);
}
// ¿Ya se cargó el registro de servicios? (la versión de Claude marca hist.done; la web guarda los conteos)
const archReady = () => !!(IMP.st && (IMP.st.hist?.done || IMP.st.counts?.services || IMP.st.counts?.docs));
// Los clientes atendidos más recientemente según el registro.
const archRecent = (n = 40) => (ARCH.all || []).filter(x => x.ph).sort((a, b) => String(b.last?.date || '').localeCompare(String(a.last?.date || ''))).slice(0, n);
async function archAll() {
  if (ARCH.all) return ARCH.all;
  if (!ARCH.loading) ARCH.loading = (async () => {
    const qs = await call(() => S.db.collection('archivo').limit(500).get());
    const out = [];
    qs.docs.forEach(x => {
      const e = x.data().e || {}; ARCH.docs.set(x.id, e);
      for (const [ph, list] of Object.entries(e)) {
        if (!ph || ph === '-') { list.forEach(r => { const a = archRec(r); out.push({ ph: '', name: a.name, n: 1, last: a, h: norm(a.name + ' ' + a.inv) }); }); continue; }
        const recs = list.map(archRec); const names = [...new Set(recs.map(r => r.name).filter(Boolean))];
        out.push({ ph, name: names[0] || '', names, n: recs.length, last: recs[0], h: norm(names.join(' ') + ' ' + ph) });
      }
    });
    ARCH.all = out; return out;
  })().finally(() => { ARCH.loading = null; });
  return ARCH.loading;
}
function archSearch(q) {
  if (!ARCH.all) return [];
  const raw = digits(q); const words = norm(q).split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  return ARCH.all.filter(x => (raw.length >= 4 && x.ph.includes(raw)) || words.every(w => x.h.includes(w)))
    .sort((a, b) => String(b.last?.date || '').localeCompare(String(a.last?.date || ''))).slice(0, 60);
}
const archHistHtml = (recs, max = 30) => recs.length ? `<ul class="hist">${recs.slice(0, max).map(r => `<li><span class="muted">${r.date ? esc(fmtDateY(r.date)) : '—'}</span><span><b>Factura ${esc(r.inv)}</b>${archAmt(r.amt) ? ' · ' + archAmt(r.amt) : ''}${r.tech ? ' · ' + esc(r.tech) : ''}${r.name ? ' · ' + esc(r.name) : ''}${r.approx ? ' <span class="small muted">(fecha aproximada)</span>' : ''}</span></li>`).join('')}</ul>${recs.length > max ? `<p class="small muted">y ${recs.length - max} más.</p>` : ''}` : '';
ACT.archOpen = async el => {
  const ph = el.dataset.ph;
  if (ph) { ACT.custOpen({ dataset: { id: ph } }); return; }
  toast('Ese servicio se anotó sin teléfono.', 'warn');

/* ---------- Reportes ----------
   Resultados del periodo comparados con el anterior, por mes, por técnico, ganancia, IVU por mes (estatal y
   municipal), cuentas por cobrar e historia del registro de servicios. Todo se puede bajar en Excel.
   El dinero de servicios y mostrador se cuenta "cobrado con IVU" (como en la caja y en el registro); la
   ganancia y el IVU se calculan sin IVU. El registro de servicios cuenta solo antes de que empezara la app. */
IC.chart = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18"/><path d="M6 16v-5"/><path d="M11 16V6"/><path d="M16 16v-8"/><path d="M21 16v-3"/></svg>';
VIEWS.reportes = vReportes; OFFICE_VIEWS.push('reportes');
const REP_PRESETS = [['mes', 'Este mes'], ['mesant', 'Mes pasado'], ['anio', 'Este año'], ['anioant', 'Año pasado'], ['rango', 'Fechas']];
const pad2 = n => String(n).padStart(2, '0');
const lastDayOf = (y, m) => new Date(y, m, 0).getDate();
const prevYm = (y, m) => m === 1 ? [y - 1, 12] : [y, m - 1];
const dayOfIso = iso => iso ? ymd(new Date(iso)) : '';
const daysSpan = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 86400000) + 1;
const monthLbl = mo => { const [y, m] = mo.split('-').map(Number); return `${MES[m - 1].slice(0, 3)} ${y}`; };
const moneyK = n => { const v = Math.abs(num(n)); const s = v >= 1e6 ? (v / 1e6).toFixed(1).replace('.0', '') + 'M' : v >= 1e3 ? (v / 1e3).toFixed(v >= 1e4 ? 0 : 1).replace('.0', '') + 'k' : String(Math.round(v)); return (num(n) < 0 ? '−$' : '$') + s; };
const pctChg = (a, b) => !b ? null : Math.round((a - b) / Math.abs(b) * 100);
function repRange() {

  const ym = (yy, mm) => `${yy}-${pad2(mm)}`;

    return { p, from: ym(py, pm) + '-01', to: ym(py, pm) + '-' + pad2(lastDayOf(py, pm)), pf: ym(qy, qm) + '-01', pt: ym(qy, qm) + '-' + pad2(lastDayOf(qy, qm)), label: `${MES[pm - 1]} ${py}`, plabel: `${MES[qm - 1]} ${qy}` };

  if (p === 'anioant') return { p, from: `${y - 1}-01-01`, to: `${y - 1}-12-31`, pf: `${y - 2}-01-01`, pt: `${y - 2}-12-31`, label: String(y - 1), plabel: String(y - 2) };
  if (p === 'rango') {

async function repLoad(R) {

/* =====================================================================
   Versión web (GitHub Pages + Firebase)
   Solo entra en la versión web (build_web.py). Cambia la base de datos
   de Claude por Firebase (Firestore y cuentas con email) y añade la
   entrada con cuenta, las cuentas del equipo, las descargas, la carga
   de datos y las actualizaciones automáticas.
   Las funciones con el mismo nombre que en los otros archivos los
   reemplazan (en JavaScript gana la última declaración).
   ===================================================================== */
const APP_VERSION = '2026.11.21-de54c2';
const FB_CONFIG = window.FB_CONFIG || null;
const PACK = 24;   // el inventario va en 24 documentos (inv/b0…b23), unos 150 artículos en cada uno
const W = {
  phase: 'start', user: null, u: null, auth: null, fs: null,
  f: { mode: 'login', name: '', email: '', pass: '', pass2: '' }, msg: '', msgKind: '',
  users: null, usersUnsub: null, userUnsub: null, started: false, revoked: false, leaving: false,
  sw: null, updReady: false, lastCheck: 0, impPlan: null, shareFile: null, pendingName: '', uJson: '',
};
const ROLE_LABEL = { pending: 'Esperando aprobación', office: 'Oficina', tech: 'Técnico', admin: 'Administrador', off: 'Sin acceso' };
const isStaffRole = r => r === 'admin' || r === 'office' || r === 'tech';

/* ---------- Firestore: errores y escrituras ---------- */
const FB_CODES = { 'not-found': 'invalid_argument', 'permission-denied': 'denied', 'resource-exhausted': 'resource_exhausted', 'unavailable': 'unavailable', 'deadline-exceeded': 'unavailable', 'cancelled': 'unavailable', 'internal': 'unavailable', 'aborted': 'busy', 'unauthenticated': 'revoked', 'failed-precondition': 'precondition', 'invalid-argument': 'bad_data' };
function fbErr(e) {
  if (!e || typeof e !== 'object' || !FB_CODES[e.code]) return e;
  const code = FB_CODES[e.code];
  return { code, fb: e.code, message: code === 'busy' ? 'Otra persona está modificando este registro. Intenta de nuevo en unos segundos.' : (e.message || '') };
}
const snapErr = cb => e => { if (cb) cb(fbErr(e)); };
const withTimeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout', message: 'La conexión está lenta.' }), ms))]);
let lateAt = 0;
function lateErr(e) {
  console.warn('Escritura rechazada', e);
  if (Date.now() - lateAt < 4000) return;
  lateAt = Date.now();
  toast(e?.code === 'denied' ? 'Un cambio no se guardó: tu cuenta no tiene permiso.' : 'Un cambio no se pudo guardar: ' + errMsg(e), 'err');
}
/* Firestore guarda cada cambio enseguida en el dispositivo y lo envía cuando hay señal. La app espera la confirmación
   del servidor unos segundos; sin señal sigue enseguida y el cambio sale solo al volver el internet. */
function settle(p, ms) {
  return new Promise((res, rej) => {
    let open = true;
    const wait = ms != null ? ms : (navigator.onLine === false || S.conn === 'offline') ? 350 : 6000;
    const t = setTimeout(() => { if (open) { open = false; res(); } }, wait);
    p.then(v => { if (open) { open = false; clearTimeout(t); res(v); } },
      e => { const x = fbErr(e); if (open) { open = false; clearTimeout(t); rej(x); } else lateErr(x); });
  });
}
const FV = () => firebase.firestore.FieldValue;
const FP = (...p) => new firebase.firestore.FieldPath(...p.map(String));
const isMap = v => { if (!v || typeof v !== 'object' || Array.isArray(v)) return false; const p = Object.getPrototypeOf(v); return p === Object.prototype || p === null; };
/* La base de datos de Claude mezcla los objetos anidados al actualizar; Firestore los reemplaza.
   Aquí cada valor anidado se convierte en su propia ruta (a.b.c) para que se mezcle igual. */
function flat(obj, pre = [], out = []) {
  for (const [k, v] of Object.entries(obj || {})) {
    if (v === undefined) continue;
    if (isMap(v)) { if (Object.keys(v).length) flat(v, [...pre, k], out); }
    else out.push(FP(...pre, k), v);
  }
  return out;
}
function fbDoc(path) {
  const ref = W.fs.doc(path);
  return {
    id: ref.id, path: ref.path,
    get: () => ref.get().catch(e => { throw fbErr(e); }),
    set: (data, opts) => settle(opts ? ref.set(data, opts) : ref.set(data)),
    update: patch => { const a = flat(patch); return a.length ? settle(ref.update(...a)) : Promise.resolve(); },
    delete: () => settle(ref.delete()),
    onSnapshot: (a, b, c) => typeof a === 'function' ? ref.onSnapshot(a, snapErr(b)) : ref.onSnapshot(a, b, snapErr(c)),
    acquire: () => Promise.resolve({ acquired: true }),
  };
}
function fbQuery(q) {
  return {
    where: (f, op, v) => fbQuery(q.where(f, op, v)),
    orderBy: (f, d) => fbQuery(d ? q.orderBy(f, d) : q.orderBy(f)),
    limit: n => fbQuery(q.limit(n)),
    get: () => q.get().catch(e => { throw fbErr(e); }),
    onSnapshot: (next, err) => q.onSnapshot(next, snapErr(err)),
  };
}
const fbDb = () => ({ doc: fbDoc, collection: p => fbQuery(W.fs.collection(p)) });

/* ---------- Inventario en paquetes ----------
   Firestore cobra por documento leído. Con un documento por artículo, abrir la app leería más de 3,500;
   así lee 24. Cada artículo vive en inv/b{n} dentro del campo items.{id}. */
const packOf = id => { let h = 0; for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h % PACK; };
const packRef = id => W.fs.doc('inv/b' + packOf(id));
const IP = (id, ...k) => FP('items', id, ...k);
function itemRef(id) {
  const pref = packRef(id);
  return {
    id,
    async get() {
      const it = S.items.get(id);
      if (it) { const { id: _i, _h, ...d } = it; return { exists: true, id, data: () => structuredClone(d) }; }
      const s = await pref.get().catch(e => { throw fbErr(e); });
      const v = s.exists ? (s.data().items || {})[id] : null;
      return { exists: !!v, id, data: () => v || undefined };
    },
    set: data => settle(pref.set({ items: { [id]: data } }, { mergeFields: [IP(id)] })),
    update(patch) {
      if (!S.items.has(id)) return Promise.reject(E('missing', 'Ese artículo ya no existe en el inventario.'));
      const a = flat(patch, ['items', id]);
      return a.length ? settle(pref.update(...a)) : Promise.resolve();
    },
    delete: () => settle(pref.update(IP(id), FV().delete())),
    acquire: () => Promise.resolve({ acquired: true }),
  };
}
function subscribeInv(db, fresh, onErr) {
  const held = new Map();
  W.fs.collection('inv').onSnapshot(qs => {
    for (const ch of qs.docChanges()) {
      const was = held.get(ch.doc.id) || new Set(); const now = new Set();
      if (ch.type !== 'removed') for (const [id, v] of Object.entries(ch.doc.data().items || {})) if (isMap(v)) { S.items.set(id, { id, ...v }); now.add(id); }
      for (const id of was) if (!now.has(id)) S.items.delete(id);
      held.set(ch.doc.id, now);
    }
    S.ready.b.fill(true); fresh(qs.metadata); schedule();
  }, snapErr(onErr('items')));
}
// Las cerradas más recientes (sin índice compuesto). Un técnico necesita menos.
function closedQuery(db) { return db.collection('orders').orderBy('closedAt', 'desc').limit(W.u?.role === 'tech' ? 80 : 200); }
/* Existencias: se suman o restan en el servidor (increment), así dos personas pueden mover la misma pieza a la vez.
   lm guarda los últimos movimientos aplicados para no repetir uno si se vuelve a intentar. */
function writeItem(itemId, args, mid, lm, extra, diff) {
  args.push(IP(itemId, 'upd'), nowIso());
  if (mid) args.push(IP(itemId, 'lm'), [...lm, mid].slice(-20));
  for (const [k, v] of Object.entries(extra || {})) if (v !== undefined) args.push(IP(itemId, k), v);
  return settle(packRef(itemId).update(...args)).then(() => ({ diff }));
}
async function mutateStock(itemId, fn, mid, extra) {
  const it = S.items.get(itemId);
  if (!it) throw E('missing', 'Ese artículo ya no existe en el inventario.');
  const lm = Array.isArray(it.lm) ? it.lm : [];
  if (mid && lm.includes(mid)) return { diff: {}, already: true };
  const cur = it.stock || {}; const next = fn(cur) || {};
  const diff = {}; const args = [];
  for (const [l, v] of Object.entries(next)) { const d = r2(num(v) - num(cur[l])); diff[l] = d; if (d) args.push(IP(itemId, 'stock', l), FV().increment(d)); }
  return writeItem(itemId, args, mid, lm, extra, diff);
}
async function setStock(itemId, loc, real, mid) {
  const it = S.items.get(itemId);
  if (!it) throw E('missing', 'Ese artículo ya no existe en el inventario.');
  const lm = Array.isArray(it.lm) ? it.lm : [];
  if (mid && lm.includes(mid)) return { diff: {}, already: true };
  const q = r2(num(real));
  return writeItem(itemId, [IP(itemId, 'stock', loc), q], mid, lm, null, { [loc]: r2(q - qtyAt(it, loc)) });
}

}
const online = () => navigator.onLine !== false && S.conn !== 'offline';
async function nextNo(field, start) {
  const ref = W.fs.doc('meta/counter');
  if (online()) {
    try {
      return await withTimeout(W.fs.runTransaction(async tx => {
        const s = await tx.get(ref);
        const n = (s.exists && s.data()[field] != null ? num(s.data()[field]) : start) + 1;
        tx.set(ref, { [field]: n }, { merge: true });
        return n;
      }), 10000);
    } catch (e) { const x = fbErr(e); if (x?.code === 'denied') throw x; console.warn('contador', x); }
  }
  return 100000 + Date.now() % 900000;   // sin señal: un número de 6 cifras que no choca con la numeración normal
}
async function assignOrder(id, techId, day) {
  const ref = W.fs.doc('orders/' + id);
  const check = d => {
    if (!d) throw E('missing', 'Esta llamada ya no existe.');
    if (!d.open) throw E('missing', 'Esta llamada ya está cerrada.');
    if (!isOffice() && d.tech && d.tech !== techId && d.date && d.status !== 'pend_pieza') throw E('missing', `Esta llamada ya la tomó ${techName(d.tech)}.`);
  };
  const patch = () => flat({ tech: techId, date: day, seq: nextSeq(techId, day), status: 'programada', open: true, h: { [hid()]: { at: nowIso(), by: S.profile, s: 'programada', note: `Programada con ${techName(techId)} para ${fmtShort(day)}` } } });
  if (online()) {
    try { await withTimeout(W.fs.runTransaction(async tx => { const s = await tx.get(ref); check(s.exists ? s.data() : null); tx.update(ref, ...patch()); }), 10000); return; }
    catch (e) { const x = fbErr(e); if (!(x?.code === 'unavailable' && x.fb)) throw x; }
  }
  check(getOrder(id));
  await settle(ref.update(...patch()));
}

function errMsg(e) {
  const c = e?.code;
  if (c === 'denied') return 'Tu cuenta no tiene permiso para esto. Pide a la oficina que revise tu acceso.';
  if (c === 'invalid_argument') return 'Ese registro ya no existe o lo cambió otra persona. Recarga e intenta otra vez.';
  if (c === 'unavailable') return 'No hay conexión con la base de datos. Revisa el internet e intenta otra vez.';
  if (c === 'timeout') return 'La conexión está lenta. Revisa en un momento si el cambio quedó hecho.';
  if (c === 'precondition') return 'La base de datos no aceptó la operación. Intenta otra vez en un momento.';
  if (c === 'bad_data') return 'Ese dato no se pudo guardar en la base de datos.';
  if (typeof c === 'string' && c.startsWith('auth/')) return authMsg(e);
  return errMsg0(e);
}

ACT.userCreate = async () => {

    try { await sa.signOut(); } catch { /* nada */ }
  } catch (e) {

    toast(e?.code === 'auth/email-already-in-use' ? 'Ya hay una cuenta con ese email. Si es de alguien del equipo, búscala en la lista y dale acceso.' : String(e?.code || '').startsWith('auth/') ? authMsg(e) : errMsg(fbErr(e)), 'err');

  S.copyText = `${name}, ya tienes cuenta en la app de ${biz().name || 'la tienda'}.\nEntra en: ${appUrl()}\nEmail: ${email}\nContraseña: ${pass}\nDespués puedes cambiarla: toca tu nombre arriba → Cambiar contraseña.`;

async function runImport() { toast('En esta versión los datos se cargan desde un archivo, en Ajustes.', 'warn'); }
ACT.impOpen = () => { if (location.hash !== '#ajustes') location.hash = '#ajustes'; };

/* ---------- Actualizaciones automáticas (como Mi Ruta) ---------- */
async function checkForUpdate() {
  if (!W.sw) return false;
  W.lastCheck = Date.now();
  try { await W.sw.update(); } catch { return false; }
  return !!(W.sw.installing || W.sw.waiting);
}
const isTyping = () => { const a = document.activeElement; return !!a && (a.tagName === 'TEXTAREA' || a.tagName === 'SELECT' || (a.tagName === 'INPUT' && !['button', 'checkbox', 'radio', 'file'].includes(a.type))); };
function tryApplyUpdate() {
  if (!W.updReady) return;
  if (MS.length || busyEl || S.impRunning || isTyping() || Object.keys(cntDirty).length) return;   // primero termina lo que está abierto
  try { sessionStorage.setItem('mas-updated', '1'); } catch { /* sin aviso */ }
  location.reload();
}
async function setupUpdates() {
  if (!('serviceWorker' in navigator) || !location.protocol.startsWith('http') || window.top !== window) return;
  try { W.sw = await navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }); } catch (e) { console.warn('sw', e); return; }
  let had = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (!had) { had = true; return; } W.updReady = true; schedule(); tryApplyUpdate(); });
  checkForUpdate();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - W.lastCheck > 60000) checkForUpdate(); });
  setInterval(tryApplyUpdate, 3000);
}
ACT.checkUpdate = async () => {
  if (!W.sw) { toast('Las actualizaciones automáticas funcionan en la app publicada.', 'warn'); return; }
  if (navigator.onLine === false) { toast('Sin internet. Intenta cuando tengas conexión.', 'warn'); return; }
  toast('Buscando versión nueva…');
  const found = await checkForUpdate();
  toast(found ? 'Bajando la versión nueva. La app se va a recargar.' : `Ya tienes la versión más reciente (${APP_VERSION}).`, 'ok');
};

/* ---------- Arranque ---------- */
async function boot() {
  S.profile = lsGet('profile') || 'office';
  const h = location.hash.slice(1); if (VIEWS[h]) S.ui.view = h;
  S.dl = { save: webSave };
  render();
  setupUpdates();
  try { if (sessionStorage.getItem('mas-updated')) { sessionStorage.removeItem('mas-updated'); setTimeout(() => toast(`La app se actualizó (versión ${APP_VERSION})`, 'ok'), 800); } } catch { /* sin aviso */ }
  if (!window.firebase || !FB_CONFIG || !FB_CONFIG.apiKey) { W.phase = 'config'; render(); return; }
  try {
    firebase.initializeApp(FB_CONFIG);
    W.auth = firebase.auth(); W.auth.languageCode = 'es';
    W.fs = firebase.firestore();
    try { W.fs.settings({ ignoreUndefinedProperties: true }); } catch (e) { console.warn(e); }
    try { await W.fs.enablePersistence({ synchronizeTabs: true }); } catch (e) { console.warn('Sin copia local en este navegador', e?.code); }
  } catch (e) { console.warn(e); W.phase = 'error'; W.msg = 'No se pudo iniciar Firebase: ' + (e?.message || e); render(); return; }
  if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
  W.auth.onAuthStateChanged(u => { onUser(u).catch(e => { console.warn(e); W.phase = 'error'; W.msg = errMsg(fbErr(e)); render(); }); });
}
boot();

</script>
